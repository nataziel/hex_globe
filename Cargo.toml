[package]
name = "hex_globe"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/halfedge"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui",
    "dynamic_linking",
] }
bevy_panorbit_camera = "0.35"
noiz = "0.5"
rand = "0.10"
hex_globe_halfedge = { path = "crates/halfedge" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package.metadata.bevy_lint]
pedantic = "warn"
